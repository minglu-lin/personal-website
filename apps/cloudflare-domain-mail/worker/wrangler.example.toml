name = "cloudflare-domain-mail"
main = "worker.js"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

[vars]
TITLE = "Custom Domain Mail"
ANNOUNCEMENT = "Welcome to your private custom domain email portal."
DOMAINS = ["yourdomain.com"]
PREFIX = ""
NEED_PASSWORD = false
PASSWORDS = ["your_site_password"]
ADMIN_PASSWORDS = ["your_admin_password"]
ENABLE_ANALYTICS = true
ALERT_EMAIL = "admin@yourdomain.com"
SEND_MAIL = "security@yourdomain.com"

# Bind D1 Database
[[d1_databases]]
binding = "DB"
database_name = "cloudflare_temp_email"
database_id = "your_d1_database_id_here"

# Bind KV Namespace
[[kv_namespaces]]
binding = "KV"
id = "your_kv_namespace_id_here"

# Automated Clean-up Cron Trigger
[triggers]
crons = ["0 0 * * *"]
