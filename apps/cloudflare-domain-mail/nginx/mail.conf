server {
    listen 80;
    listen [::]:80;
    server_name mail.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mail.yourdomain.com;

    # SSL Certificates
    ssl_certificate /etc/ssl/yourdomain.com/cert.pem;
    ssl_certificate_key /etc/ssl/yourdomain.com/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Frontend Root
    root /var/www/mail_frontend;
    index index.html;

    # WASM MIME Configuration
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Static Assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Reverse Proxy API requests to Cloudflare Worker
    location ~ ^/(api|open_api|user_api|admin)/ {
        proxy_pass https://mail.yourdomain.com;
        proxy_set_header Host mail.yourdomain.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
