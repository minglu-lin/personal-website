version: '3.8'

services:
  myip:
    image: jason5ng32/myip:latest
    container_name: myip-service
    restart: always
    ports:
      - "18966:18966"
    environment:
      - PORT=18966
      - MAXMIND_ACCOUNT_ID=${MAXMIND_ACCOUNT_ID:-}
      - MAXMIND_LICENSE_KEY=${MAXMIND_LICENSE_KEY:-}
      - MAXMIND_AUTO_UPDATE=true
      - ALLOWED_DOMAINS=${ALLOWED_DOMAINS:-ip.lmlu.de,ip.11231632.xyz,localhost}
    volumes:
      - ./data:/app/data
