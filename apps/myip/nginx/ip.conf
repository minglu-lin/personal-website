# ==============================================================================
# MyIP Toolbox Nginx Reverse Proxy Configuration
# Subdomain: ip.<domain> (e.g. ip.lmlu.de, ip.11231632.xyz)
# Target: Docker Container at 127.0.0.1:18966
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name ip.lmlu.de ip.11231632.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ip.lmlu.de ip.11231632.xyz;

    # SSL Certificates (Cloudflare Origin Cert / Let's Encrypt / Sing-box Cert)
    ssl_certificate /etc/s-box/cert.pem;
    ssl_certificate_key /etc/s-box/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Proxy to MyIP Docker Container
    location / {
        proxy_pass http://127.0.0.1:18966;
        proxy_http_version 1.1;

        # Real Client IP Pass-Through
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    server_tokens off;
}
