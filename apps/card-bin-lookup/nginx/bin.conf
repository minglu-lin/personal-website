# Card BIN / IIN Intelligence Lookup Subdomain Configuration (bin.11231632.xyz)
server {
    listen 80;
    listen [::]:80;
    server_name bin.11231632.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bin.11231632.xyz;

    ssl_certificate /etc/s-box/cert.pem;
    ssl_certificate_key /etc/s-box/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:18895;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    server_tokens off;
}
