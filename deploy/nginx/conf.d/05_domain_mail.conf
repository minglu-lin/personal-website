# ==============================================================================
# 05. Cloud Domain Mail (mail.<domain>)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name mail.lmlu.de mail.11231632.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mail.lmlu.de mail.11231632.xyz;

    ssl_certificate /etc/s-box/cert.pem;
    ssl_certificate_key /etc/s-box/private.key;

    root /var/www/personal-website/apps/cloudflare-domain-mail/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    server_tokens off;
}
