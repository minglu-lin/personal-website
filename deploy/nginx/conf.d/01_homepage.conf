# ==============================================================================
# 01. Academic Personal Homepage (Apex & WWW)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name lmlu.de www.lmlu.de 11231632.xyz www.11231632.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lmlu.de www.lmlu.de 11231632.xyz www.11231632.xyz;

    ssl_certificate /etc/s-box/cert.pem;
    ssl_certificate_key /etc/s-box/private.key;

    root /var/www/personal-website/sites/homepage;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    error_page 404 /index.html;
    server_tokens off;
}
