# ==============================================================================
# 04. Fleet Telemetry Monitor (status-k9x2.<domain>)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name status-k9x2.lmlu.de status-k9x2.11231632.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name status-k9x2.lmlu.de status-k9x2.11231632.xyz;

    ssl_certificate /etc/s-box/cert.pem;
    ssl_certificate_key /etc/s-box/private.key;

    # Basic Auth protection (recommended for telemetry probe)
    # auth_basic "Telemetry Dashboard";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:18889;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    server_tokens off;
}
